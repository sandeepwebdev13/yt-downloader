<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --primary-variant: #3700b3;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --error: #cf6679;
            --success: #03dac6;
            --border-radius: 8px;
            --transition: 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--surface);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 24px;
            font-weight: 400;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid #333;
            border-radius: var(--border-radius);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border var(--transition);
        }
        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 24px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: background var(--transition);
        }
        button:hover {
            background: #a06cd5;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            background: var(--error);
            color: #000;
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .success {
            background: var(--success);
            color: #000;
            padding: 12px;
            border-radius: var(--border-radius);
            margin-top: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .preview {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: var(--bg);
            padding: 15px;
            border-radius: var(--border-radius);
            align-items: center;
        }
        .preview img {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border-radius: 4px;
        }
        .preview .info h2 {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .preview .info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .download-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        select {
            flex: 1;
            padding: 12px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid #333;
            border-radius: var(--border-radius);
            font-size: 16px;
            outline: none;
        }

        .progress-container {
            margin: 20px 0;
        }
        .progress-bar {
            background: #333;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s;
        }
        #progressText {
            text-align: right;
            margin-top: 5px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        #statusText {
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YouTube Downloader</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste YouTube URL here...">
            <button id="fetchBtn" class="primary">Fetch Info</button>
        </div>

        <div id="errorMsg" class="error hidden"></div>

        <div id="preview" class="preview hidden">
            <img id="thumbnail" src="" alt="Thumbnail">
            <div class="info">
                <h2 id="videoTitle"></h2>
                <p id="videoDuration"></p>
            </div>
        </div>

        <div id="downloadSection" class="download-section hidden">
            <select id="formatSelect"></select>
            <button id="downloadBtn" class="primary">Download</button>
        </div>

        <div id="progressContainer" class="progress-container hidden">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <p id="progressText">0%</p>
            <p id="statusText"></p>
        </div>

        <div id="successMsg" class="success hidden">✅ Download completed!</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlInput = document.getElementById('urlInput');
            const fetchBtn = document.getElementById('fetchBtn');
            const errorMsg = document.getElementById('errorMsg');
            const preview = document.getElementById('preview');
            const thumbnail = document.getElementById('thumbnail');
            const videoTitle = document.getElementById('videoTitle');
            const videoDuration = document.getElementById('videoDuration');
            const downloadSection = document.getElementById('downloadSection');
            const formatSelect = document.getElementById('formatSelect');
            const downloadBtn = document.getElementById('downloadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const statusText = document.getElementById('statusText');
            const successMsg = document.getElementById('successMsg');

            let currentVideoUrl = '';
            let downloadInProgress = false;
            let eventSource = null;

            function formatDuration(sec) {
                if (!sec) return 'Unknown';
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                return `${m}:${s.toString().padStart(2,'0')}`;
            }

            function clearMessages() {
                errorMsg.classList.add('hidden');
                successMsg.classList.add('hidden');
            }

            function showError(text) {
                errorMsg.textContent = text;
                errorMsg.classList.remove('hidden');
                successMsg.classList.add('hidden');
            }

            fetchBtn.addEventListener('click', async () => {
                const url = urlInput.value.trim();
                if (!url) {
                    showError('Please enter a YouTube URL');
                    return;
                }

                clearMessages();
                preview.classList.add('hidden');
                downloadSection.classList.add('hidden');
                progressContainer.classList.add('hidden');
                fetchBtn.disabled = true;
                fetchBtn.textContent = 'Loading...';

                try {
                    const response = await fetch('/info', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({url})
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Failed to fetch info');

                    videoTitle.textContent = data.title;
                    thumbnail.src = data.thumbnail;
                    videoDuration.textContent = `Duration: ${formatDuration(data.duration)}`;
                    currentVideoUrl = url;

                    formatSelect.innerHTML = '';
                    data.formats.forEach(fmt => {
                        const option = document.createElement('option');
                        option.value = fmt.id;
                        option.textContent = fmt.label;
                        formatSelect.appendChild(option);
                    });

                    preview.classList.remove('hidden');
                    downloadSection.classList.remove('hidden');
                    errorMsg.classList.add('hidden');
                } catch (err) {
                    showError(err.message);
                } finally {
                    fetchBtn.disabled = false;
                    fetchBtn.textContent = 'Fetch Info';
                }
            });

            downloadBtn.addEventListener('click', async () => {
                if (!currentVideoUrl || downloadInProgress) return;

                const format = formatSelect.value;
                if (!format) return;

                clearMessages();
                downloadInProgress = true;
                downloadBtn.disabled = true;
                fetchBtn.disabled = true;
                progressContainer.classList.remove('hidden');
                progressFill.style.width = '0%';
                progressText.textContent = '0%';
                statusText.textContent = 'Starting download...';

                try {
                    const response = await fetch('/download', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({url: currentVideoUrl, format})
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Download failed');

                    const downloadId = data.download_id;

                    if (eventSource) eventSource.close();
                    eventSource = new EventSource(`/progress/${downloadId}`);

                    eventSource.onmessage = (event) => {
                        const progressData = JSON.parse(event.data);
                        const {status, percent, error} = progressData;

                        if (status === 'error') {
                            showError(error || 'Download error');
                            cleanupDownload();
                            return;
                        }

                        const rounded = Math.round(percent);
                        progressFill.style.width = `${rounded}%`;
                        progressText.textContent = `${rounded}%`;

                        if (status === 'downloading') {
                            statusText.textContent = `Downloading... ${progressData.speed || ''} ${progressData.eta ? 'ETA ' + progressData.eta : ''}`;
                        } else if (status === 'processing') {
                            statusText.textContent = 'Processing video...';
                        } else if (status === 'completed') {
                            statusText.textContent = 'Download complete!';
                            window.location.href = `/file/${downloadId}`;
                            successMsg.classList.remove('hidden');
                            cleanupDownload();
                        }
                    };

                    eventSource.onerror = () => {
                        showError('Connection lost or download failed');
                        cleanupDownload();
                    };

                } catch (err) {
                    showError(err.message);
                    cleanupDownload();
                }
            });

            function cleanupDownload() {
                downloadInProgress = false;
                downloadBtn.disabled = false;
                fetchBtn.disabled = false;
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
            }
        });
    </script>
</body>
</html>
